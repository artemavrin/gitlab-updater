name: Release

# Everything this workflow publishes is read by people who arrive from a
# search result, so it is written in English — same as README.md. The Russian
# side of the project lives in README.ru.md and in the interface itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
      ref:
        description: 'Which commit to tag, if the tag does not exist yet. Empty means the branch selected above.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Что чекаутить, решаем ДО чекаута — по тому, есть ли уже такой тег.
      #
      # Дерево релиза обязано быть деревом тега: checkout без ref берёт ref
      # события, и для ручного запуска это HEAD ветки, то есть под именем тега
      # уехало бы содержимое ветки. Проверено вживую: запуск с тегом v0.1.16
      # при main на 0.1.18 упал на сверке версий — лучший из исходов, совпади
      # числа, подмена прошла бы молча.
      #
      # Но тега может ещё не быть: релиз выпускают из браузера, где сделать
      # git push тега нечем. Тогда чекаутим коммит (поле ref) или, если оно
      # пустое, ветку, из которой запустили, — и тег ставит сам workflow ниже.
      # Спрашивать про тег ПОСЛЕ чекаута нельзя: именно на несуществующем теге
      # чекаут и падает, чужой ошибкой git, до единой нашей строки. Так и
      # случилось на первом же настоящем запуске.
      - name: Decide what to check out
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.event.inputs.ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            # Push тега: дерево уже то самое, и создавать нечего.
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "exists=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          case "$code" in
            200)
              if [ -n "$REF" ]; then
                echo "::error::Tag $TAG already exists, so 'ref' would build something else under its name."
                echo "::error::Re-run with an empty 'ref' to release the tag as it stands."
                exit 1
              fi
              echo "Tag $TAG exists; releasing that tree."
              echo "ref=$TAG" >> "$GITHUB_OUTPUT"
              echo "exists=yes" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Tag $TAG does not exist yet; will tag ${REF:-$BRANCH}."
              echo "ref=${REF:-$BRANCH}" >> "$GITHUB_OUTPUT"
              echo "exists=no" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not ask GitHub whether $TAG exists: HTTP $code."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Tag must match the version in package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag $tag, package.json $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::The tag and package.json disagree: $tag vs $pkg."
            echo "::error::This is the tree at $tag, so the tag sits on a commit carrying $pkg."
            echo "::error::Publishing would ship a bundle whose --version does not match its own release page."
            echo "::error::Bump package.json to ${tag#v}, push it, then move the tag onto that commit:"
            echo "::error::  git tag -d $tag && git push origin :refs/tags/$tag"
            echo "::error::  git tag -a $tag -m 'gitlab-upgrade ${tag#v}' && git push origin $tag"
            exit 1
          fi

      - name: Create the tag
        if: steps.pick.outputs.exists == 'no'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          # Версия уже сверена шагом выше и сверена по ЭТОМУ дереву: тег
          # физически встаёт на коммит, который эту версию и несёт.
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "gitlab-upgrade ${TAG#v}"
          git push origin "$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG."

      - name: Build the single file
        run: npm run build

      - name: Source archive, for running without a build
        run: |
          tar --transform 's,^,gitlab-upgrade/,' \
              -czf dist/gitlab-upgrade-src.tar.gz bin src data package.json README.md LICENSE
          ( cd dist && sha256sum gitlab-upgrade-src.tar.gz > gitlab-upgrade-src.tar.gz.sha256 )

      - name: Assemble release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash .github/release-notes.sh > release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          # Автоматические заметки собираются из заголовков коммитов, а они
          # русские: на английской странице релиза это выглядело бы как
          # недоделка. Тело собирается .github/release-notes.sh — его можно
          # прочитать глазами до тега, в отличие от строки внутри workflow.
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            setup.sh
            dist/gitlab-upgrade.mjs
            dist/gitlab-upgrade.mjs.sha256
            dist/gitlab-upgrade-src.tar.gz
            dist/gitlab-upgrade-src.tar.gz.sha256
