name: Release

# Everything this workflow publishes is read by people who arrive from a
# search result, so it is written in English — same as README.md. The Russian
# side of the project lives in README.ru.md and in the interface itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Tag must match the version in package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag $tag, package.json $pkg"
          test "$tag" = "$pkg"

      - name: Build the single file
        run: npm run build

      - name: Source archive, for running without a build
        run: |
          tar --transform 's,^,gitlab-upgrade/,' \
              -czf dist/gitlab-upgrade-src.tar.gz bin src data package.json README.md LICENSE
          ( cd dist && sha256sum gitlab-upgrade-src.tar.gz > gitlab-upgrade-src.tar.gz.sha256 )

      - name: Assemble release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash .github/release-notes.sh > release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          # Автоматические заметки собираются из заголовков коммитов, а они
          # русские: на английской странице релиза это выглядело бы как
          # недоделка. Тело собирается .github/release-notes.sh — его можно
          # прочитать глазами до тега, в отличие от строки внутри workflow.
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            setup.sh
            dist/gitlab-upgrade.mjs
            dist/gitlab-upgrade.mjs.sha256
            dist/gitlab-upgrade-src.tar.gz
            dist/gitlab-upgrade-src.tar.gz.sha256
