name: Release

# Everything this workflow publishes is read by people who arrive from a
# search result, so it is written in English — same as README.md. The Russian
# side of the project lives in README.ru.md and in the interface itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
      ref:
        description: 'Commit or branch to tag, when the tag does not exist yet. Leave empty to release an existing tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Дерево релиза — это дерево тега. checkout без ref взял бы ref события:
      # для push тега это сам тег, а для ручного запуска — HEAD ветки, из
      # которой запустили. То есть workflow_dispatch собирал и публиковал бы
      # под именем тега содержимое main. Проверено вживую: запуск с тегом
      # v0.1.16 при main на 0.1.18 упал на сверке версий, и это был лучший из
      # исходов — совпади числа, подмена прошла бы молча.
      #
      # `ref` у ручного запуска — для тега, которого ещё нет: называют коммит,
      # workflow сам его и пометит. Без этого выпуск релиза требовал локального
      # клона, чтобы сделать один git push тега.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Tag must match the version in package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag $tag, package.json $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::The tag and package.json disagree: $tag vs $pkg."
            echo "::error::This is the tree at $tag, so the tag sits on a commit carrying $pkg."
            echo "::error::Publishing would ship a bundle whose --version does not match its own release page."
            echo "::error::Bump package.json to ${tag#v}, push it, then move the tag onto that commit:"
            echo "::error::  git tag -d $tag && git push origin :refs/tags/$tag"
            echo "::error::  git tag -a $tag -m 'gitlab-upgrade ${tag#v}' && git push origin $tag"
            exit 1
          fi

      - name: Create the tag, when releasing a commit that has none
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ -n "$REF" ]; then
              echo "::error::Tag $TAG already exists, so the tree came from $REF instead of the tag."
              echo "::error::Re-run with an empty 'ref' to release the tag as it stands."
              exit 1
            fi
            echo "Tag $TAG already exists; releasing it as it stands."
            exit 0
          fi
          if [ -z "$REF" ]; then
            echo "::error::Tag $TAG does not exist and no 'ref' was given."
            echo "::error::Re-run and name the commit or branch to tag in 'ref'."
            exit 1
          fi
          # Версия уже сверена шагом выше, и сверена по этому же дереву:
          # тег встаёт ровно на тот коммит, который эту версию несёт.
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "gitlab-upgrade ${TAG#v}"
          git push origin "$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG."

      - name: Build the single file
        run: npm run build

      - name: Source archive, for running without a build
        run: |
          tar --transform 's,^,gitlab-upgrade/,' \
              -czf dist/gitlab-upgrade-src.tar.gz bin src data package.json README.md LICENSE
          ( cd dist && sha256sum gitlab-upgrade-src.tar.gz > gitlab-upgrade-src.tar.gz.sha256 )

      - name: Assemble release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash .github/release-notes.sh > release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          # Автоматические заметки собираются из заголовков коммитов, а они
          # русские: на английской странице релиза это выглядело бы как
          # недоделка. Тело собирается .github/release-notes.sh — его можно
          # прочитать глазами до тега, в отличие от строки внутри workflow.
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            setup.sh
            dist/gitlab-upgrade.mjs
            dist/gitlab-upgrade.mjs.sha256
            dist/gitlab-upgrade-src.tar.gz
            dist/gitlab-upgrade-src.tar.gz.sha256
