name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница из engines и текущая LTS: на серверах встречаются обе.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Линт
        run: npm run lint

      - name: Тесты
        run: npm test

      - name: Сборка одного файла
        run: npm run build

      - name: Проверка бандла на чистом окружении
        # Бандл обязан работать без node_modules — именно так он попадёт на сервер.
        run: |
          mkdir -p /tmp/smoke && cp dist/gitlab-upgrade.mjs /tmp/smoke/
          cd /tmp/smoke
          node gitlab-upgrade.mjs --version
          node gitlab-upgrade.mjs --lang en help > /dev/null
          node gitlab-upgrade.mjs --lang ru help > /dev/null
          # GitLab на раннере нет: ожидаем понятную ошибку и код 1, а не падение
          set +e
          out=$(node gitlab-upgrade.mjs check 2>&1); code=$?
          set -e
          echo "check → $code: $out"
          test "$code" -eq 1
          case "$out" in *GitLab*) ;; *) echo "нет понятного сообщения"; exit 1 ;; esac
          # В редиректе Ink не должен подниматься: `run > log.txt` обязан дать
          # лог, а не мусор из перерисовок. Ищем управляющие последовательности.
          set +e
          node gitlab-upgrade.mjs run --yes > /tmp/run.log 2>&1
          node gitlab-upgrade.mjs doctor > /tmp/doctor.log 2>&1
          set -e
          for f in /tmp/run.log /tmp/doctor.log; do
            if grep -qP '\x1b\[' "$f"; then
              echo "в перенаправленном выводе есть ANSI ($f):"; cat -v "$f"; exit 1
            fi
          done

      - name: Контракт машинного интерфейса
        # Каталог и конверт — публичный контракт для агентов: ломать его молча нельзя.
        run: |
          cd /tmp/smoke
          node gitlab-upgrade.mjs api | jq -e '.tool == "gitlab-upgrade" and .contract == 1' > /dev/null
          node gitlab-upgrade.mjs api | jq -e '.commands.check.mutating == false' > /dev/null
          node gitlab-upgrade.mjs api | jq -e '.commands | keys | length >= 4' > /dev/null
          node gitlab-upgrade.mjs version --json | jq -e '.ok == true and .command == "version"' > /dev/null
          # при ошибке — стабильный код, а не только текст
          node gitlab-upgrade.mjs check --json 2>/dev/null | jq -e '.error.code == "gitlab-not-found"' > /dev/null
          # --events не должен смешиваться с результатом на stdout
          node gitlab-upgrade.mjs version --json --events 2>/dev/null | jq -e '.command == "version"' > /dev/null
          # на раннере нет GitLab: doctor обязан честно упереться, а не отрапортовать «всё в порядке»
          set +e
          node gitlab-upgrade.mjs doctor --json > /tmp/doc.json 2>/dev/null; dcode=$?
          set -e
          test "$dcode" -eq 1
          jq -e '.error.code == "checks-failed" or .error.code == "gitlab-not-found"' /tmp/doc.json > /dev/null
