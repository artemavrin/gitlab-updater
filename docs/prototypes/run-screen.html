<title>Экран run — три направления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* ── страница-стенд ── */
  :root{ --page:#e6e8ec; --muted:#5c6572; --line:#d0d5dc; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page:#0b0e12; --muted:#79838f; --line:#20262e; }
  }
  :root[data-theme="dark"]{ --page:#0b0e12; --muted:#79838f; --line:#20262e; }

  /* терминал — один фиксированный мир в обеих темах */
  :root{
    --t-bg:#10141a; --t-bar:#171c24; --t-fg:#d4dae2; --t-dim:#79838f;
    --t-ok:#7cc394; --t-warn:#dda94c; --t-crit:#e77a7a; --t-acc:#61b7c9;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background:var(--page);
    font-family:"JetBrains Mono", ui-monospace, monospace;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:.75rem;
    padding:5.5rem 1rem 3rem;
  }
  .term{
    width:min(100%, 44rem);
    background:var(--t-bg);
    border-radius:12px; overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 1px 2px rgba(0,0,0,.2), 0 24px 60px -24px rgba(0,0,0,.5);
  }
  .termbar{
    display:flex; align-items:center; gap:.75rem;
    padding:.625rem .875rem; background:var(--t-bar);
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .dots{ display:flex; gap:6px; }
  .dots i{ width:10px; height:10px; border-radius:50%; background:#2c333d; }
  .cmd{ font-size:.75rem; color:var(--t-dim); }
  .cmd b{ color:var(--t-fg); font-weight:500; }

  #stage{
    height:34rem; overflow:hidden;
    display:flex; flex-direction:column;
    padding:.75rem 0;
    font-size:12.5px; line-height:1.5; color:var(--t-fg);
    font-variant-ligatures:none; font-feature-settings:"liga" 0,"calt" 0;
    font-variant-numeric:tabular-nums;
  }
  .grow{ flex:1 1 auto; min-height:0; }
  .feed{ flex:1 1 auto; min-height:0; overflow-y:auto; }
  .ln{ white-space:pre; padding:0 1rem; min-height:1.5em; }
  .ok{color:var(--t-ok)} .warn{color:var(--t-warn)} .crit{color:var(--t-crit)}
  .acc{color:var(--t-acc)} .dim{color:var(--t-dim)} .b{font-weight:700}
  .sp{ display:inline-block; width:1ch; color:var(--t-acc); }

  .hint{ font-size:.75rem; color:var(--muted); }
  .hint kbd{
    font:inherit; border:1px solid var(--line); border-radius:4px;
    padding:1px 5px; margin:0 1px;
  }

  /* ── ПИКЕР — спецификация, не дизайн-решение ── */
  .proto-picker {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 8px 24px rgba(0, 0, 0, 0.24),
      0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition:
      transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
      width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.4);
    outline-offset: 2px;
  }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider {
    width: 1px;
    height: 16px;
    margin: 0 4px;
    background: rgba(255, 255, 255, 0.12);
  }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>

<div class="term">
  <div class="termbar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="cmd"><b>sudo gitlab-upgrade run --yes</b> <span class="dim">· 78×34</span></div>
  </div>
  <div id="stage"></div>
</div>
<p class="hint"><kbd>c</kbd> нажать Ctrl-C · <kbd>j</kbd> прыгнуть к фазе dpkg</p>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Шапка</button>
  <button class="proto-picker-item">Строка</button>
  <button class="proto-picker-item">Веха</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* ═══════════ общий движок терминала ═══════════ */
const stage = document.getElementById('stage');
const FRAMES = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
let fi = 0;
setInterval(() => {
  fi = (fi + 1) % FRAMES.length;
  document.querySelectorAll('.sp').forEach(e => e.textContent = FRAMES[fi]);
}, 80);

let timers = [];
function clearTimers(){ timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; }
function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
function every(ms, fn){ const id = setInterval(fn, ms); timers.push(id); return id; }

const W = 78;
const len = s => [...s.replace(/<[^>]*>/g, '')].length;
const pad = (s, n) => s + ' '.repeat(Math.max(0, n - len(s)));
const spin = () => '<span class="sp">' + FRAMES[fi] + '</span>';
const clock = s => String(Math.floor(s/3600)).padStart(2,'0') + ':' +
                   String(Math.floor(s/60)%60).padStart(2,'0') + ':' +
                   String(s%60).padStart(2,'0');

let sink = stage;
function row(html, cls){
  const d = document.createElement('div');
  d.className = cls || 'ln';
  d.innerHTML = html === undefined ? '' : html;
  sink.appendChild(d);
  return d;
}

/* общая последовательность фаз шага 3 */
const PHASES = [
  { k:'disk',    at:200,  dur:900,  base:4,   done:13,  label:'место на диске',   val:'139 ГБ свободно' },
  { k:'backup',  at:1200, dur:2400, base:14,  done:204, label:'бэкап быстрый',    val:'2.1 ГБ · 3 мин · /mnt/backup/gitlab/20260830-1412' },
  { k:'install', at:3700, dur:4300, base:211, done:615, label:'установка пакета', val:'из кэша · 6 мин', danger:true },
  { k:'svc',     at:8100, dur:1400, base:622, done:708, label:'сервисы',          val:'12/12 running' },
  { k:'mig',     at:9600, dur:0,    base:715, label:'фоновые миграции', val:null }
];
const OVERALL = 3894;
const CHAIN = ['16.3.9','16.7.10','16.11.10','17.3.7','17.5.5','17.11.6'];

let api = { interrupt(){}, jump(){} };

/* проигрывает PHASES, дёргая колбэки варианта */
function play(skip, hooks){
  const A = (ms, fn) => at(Math.max(0, ms - skip), fn);
  PHASES.forEach(p => {
    if (p.val !== null && skip >= p.at + p.dur){ hooks.done(p, true); return; }
    A(p.at, () => {
      hooks.start(p);
      if (p.val !== null) at(p.dur, () => hooks.done(p, false));
    });
  });
  A(9600, () => hooks.migrations());
}

/* ═══════════ Три ленты, расходящиеся по месту таймлайна ═══════════ */
/* Общее для всех: история прокручивается, живёт только закреплённая строка. */

const DONE = 2;                       /* шаги 1-2 позади, идёт 3-й */
function chainFull(){
  const marks = ' ' + CHAIN.map((_, i) =>
    (i < DONE ? '<span class="ok">●</span>'
     : i === DONE ? '<span class="acc">◐</span>'
     : '<span class="dim">○</span>') +
    (i < 5 ? '<span class="dim">────────</span>' : '')).join('');
  const labels = ' <span class="dim">' + CHAIN.map(v => pad(v, 9)).join('') + '</span>';
  return [marks, labels];
}
const chainMini = () => CHAIN.map((_, i) =>
  i < DONE ? '<span class="ok">●</span>'
  : i === DONE ? '<span class="acc">◐</span>'
  : '<span class="dim">○</span>').join('');

const HISTORY = [
  [' <span class="dim">13:31:20</span>  <span class="b">шаг 1/6</span>  <span class="dim">16.3.9-ee</span>',
   '   <span class="ok">✓</span> бэкап полный              <span class="dim">187 ГБ · 79 мин</span>',
   '   <span class="ok">✓</span> установка пакета          <span class="dim">из кэша · 7 мин</span>',
   '   <span class="ok">✓</span> фоновые миграции          <span class="dim">132 → 0 · 41 мин</span>',
   ' <span class="dim">15:38:47</span>  <span class="ok">шаг 1/6 готово за 02:07:27</span>'],
  [' <span class="dim">15:38:48</span>  <span class="b">шаг 2/6</span>  <span class="dim">16.7.10-ee</span>',
   '   <span class="ok">✓</span> бэкап быстрый             <span class="dim">1.9 ГБ · 3 мин</span>',
   '   <span class="ok">✓</span> установка пакета          <span class="dim">из кэша · 5 мин</span>',
   '   <span class="ok">✓</span> фоновые миграции          <span class="dim">88 → 0 · 30 мин</span>',
   ' <span class="dim">16:19:55</span>  <span class="ok">шаг 2/6 готово за 00:41:07</span>'],
  [' <span class="dim">16:19:56</span>  <span class="b">шаг 3/6</span>  <span class="dim">16.11.10-ee</span>']
];

/* веха: путь печатается в саму ленту на границе шагов */
function milestone(doneCount){
  const marks = CHAIN.map((_, i) =>
    (i < doneCount ? '<span class="ok">●</span>'
     : i === doneCount ? '<span class="acc">◐</span>'
     : '<span class="dim">○</span>') +
    (i < 5 ? '<span class="dim">────────</span>' : '')).join('');
  return ['',
          ' ' + marks + '   <span class="dim">шаг ' + (doneCount + 1) + ' из 6</span>',
          ' <span class="dim">' + CHAIN.map(v => pad(v, 9)).join('') + '</span>',
          ''];
}

function buildStream(mode, skip){
  clearTimers();
  requestAnimationFrame(() => {
    stage.innerHTML = '';
    skip = skip || 0;

    /* «Шапка»: путь закреплён сверху и не прокручивается */
    if (mode === 'header'){
      sink = stage;
      chainFull().forEach(t => row(t));
      row('<span class="dim">' + '─'.repeat(W) + '</span>');
    }

    const feed = document.createElement('div'); feed.className = 'feed';
    const rule = document.createElement('div'); rule.className = 'ln';
    const pin  = document.createElement('div'); pin.className  = 'ln';
    rule.innerHTML = '<span class="dim">' + '─'.repeat(W) + '</span>';
    stage.append(feed, rule, pin);
    sink = feed;

    HISTORY.forEach((block, i) => {
      if (mode === 'milestone' && i > 0) milestone(i).forEach(t => row(t));
      else if (i > 0) row('');
      block.forEach(t => row(t));
    });

    const S = { step: 4, danger: false, remaining: 52, phase: '', phaseLabel: '' };
    const emit = html => { row(html); feed.scrollTop = feed.scrollHeight; };

    const paintPin = () => {
      const state = S.danger
        ? '<span class="crit">Ctrl-C опасен · dpkg</span>'
        : '<span class="ok">Ctrl-C безопасен</span>';
      const mid = S.phase === 'mig' ? 'миграции ' + S.remaining : S.phaseLabel;
      if (mode === 'line'){
        /* всё состояние, включая путь, в одной закреплённой строке */
        pin.innerHTML = ' ' + chainMini() + '  <span class="b">шаг 3/6</span>  <span class="dim">' +
                        clock(OVERALL + S.step) + '  ' + mid + '  ·  </span>' + state;
      } else {
        pin.innerHTML = ' <span class="b">шаг 3/6</span> <span class="dim">· ' + clock(OVERALL + S.step) +
                        ' · ' + mid + ' · </span>' + state;
      }
    };
    paintPin();
    every(1000, () => { S.step++; paintPin(); });

    let live = null;
    play(skip, {
      start(p){
        S.step = p.base; S.phase = p.k; S.phaseLabel = p.label;
        if (p.danger) S.danger = true;
        if (p.k === 'mig'){ paintPin(); return; }
        live = row('   ' + spin() + ' ' + pad(p.label, 26) + '<span class="dim">…</span>');
        feed.scrollTop = feed.scrollHeight;
        paintPin();
      },
      done(p, instant){
        S.step = p.done;
        const html = '   <span class="ok">✓</span> ' + pad(p.label, 26) + '<span class="dim">' + p.val + '</span>';
        if (instant || !live) emit(html); else live.innerHTML = html;
        live = null;
        if (p.danger) S.danger = false;
        paintPin();
      },
      migrations(){
        S.phase = 'mig';
        const mig = row('   ' + spin() + ' ' + pad('фоновые миграции', 26) + '<span class="dim">осталось 52</span>');
        feed.scrollTop = feed.scrollHeight;
        const pool = ['BackfillCiPipelineVariables       готово','BackfillProjectStatistics         23%',
                      'BackfillProjectStatistics         61%','BackfillProjectStatistics         готово',
                      'BackfillMergeRequestDiffs         8%'];
        let li = 0, t0 = 14*3600 + 53*60 + 2;
        every(1500, () => {
          feed.insertBefore(Object.assign(document.createElement('div'),
            { className:'ln', innerHTML:'     <span class="dim">' + clock(t0) + '  ' + pool[li++ % pool.length] + '</span>' }), mig);
          t0 += 39;
          feed.scrollTop = feed.scrollHeight;
        });
        every(2300, () => {
          S.remaining = Math.max(1, S.remaining - 1);
          mig.innerHTML = '   ' + spin() + ' ' + pad('фоновые миграции', 26) +
            '<span class="dim">осталось </span><span class="b">' + S.remaining + '</span>' +
            '<span class="dim"> · −8 за 10 мин</span>';
          paintPin();
        });
      }
    });

    api = {
      jump: () => buildStream(mode, 3700),
      interrupt(){
        if (!S.danger){
          clearTimers();
          emit(' <span class="dim">^C</span>');
          emit(' <span class="ok">Отсоединились. Апгрейд продолжается.</span>');
          emit(' <span class="dim">Подключиться снова: </span><span class="acc">sudo gitlab-upgrade attach</span>');
          rule.innerHTML = ''; pin.innerHTML = '';
          return;
        }
        emit('');
        emit(' <span class="crit">⛔ Сейчас идёт установка пакета (dpkg).</span>');
        emit(' <span class="dim">   Прерывание оставит систему в незавершённой транзакции dpkg.</span>');
        emit(' <span class="dim">   Выходить придётся руками: dpkg --configure -a</span>');
        emit('');
        emit(' <span class="acc">   [d]              отсоединиться, апгрейд продолжится</span>');
        emit(' <span class="dim">   [Ctrl-C ещё раз] всё равно прервать</span>');
        emit('');
      }
    };
  });
  return '';
}

const variantHeader    = () => buildStream('header');
const variantLine      = () => buildStream('line');
const variantMilestone = () => buildStream('milestone');

/* ═══════════ пикер ═══════════ */
const variants = [variantHeader, variantLine, variantMilestone];

const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
  else if (e.key === 'c' || e.key === 'C') api.interrupt();
  else if (e.key === 'j' || e.key === 'J') api.jump();
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
